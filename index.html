<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta property="og:title" content="点击查看完整资料">
<meta property="og:description" content="每日知识分享 · 点击了解详情">
<title>添加好友</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,sans-serif;padding:20px;overflow:hidden;background:#1a0a2e}
#lc-canvas{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:auto
}
.page{text-align:center;max-width:450px;width:100%;position:relative;z-index:1}
.title{color:#fff;font-size:26px;font-weight:700;margin-bottom:8px;text-shadow:0 2px 12px rgba(0,0,0,0.4)}
.sub{color:rgba(255,255,255,0.7);font-size:14px;margin-bottom:32px}
.card{background:rgba(255,255,255,0.96);border-radius:24px;padding:32px;box-shadow:0 8px 40px rgba(0,0,0,0.2)}
.qr-wrap{background:transparent;padding:0;border-radius:0;display:inline-block;position:relative}
.qr-wrap img{width:220px;height:220px;display:block;margin:0 auto;border-radius:12px}
.qr-wrap .loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#999;font-size:14px}
.wx-id{font-size:32px;font-weight:700;color:#333;margin:24px 0 8px;word-break:break-all}
.wx-label{font-size:13px;color:#999;margin-top:24px;margin-bottom:4px}
.btn{display:block;width:100%;margin-top:16px;padding:16px;background:#07C160;color:#fff;border:none;border-radius:14px;font-size:18px;font-weight:600;cursor:pointer}
.btn:active{opacity:.85}
.hint{color:#666;font-size:13px;margin-top:24px;line-height:1.8;background:#f5f5f5;border-radius:12px;padding:16px}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:#fff;padding:14px 28px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .3s;z-index:99;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<canvas id="lc-canvas"></canvas>

<div class="page">
  <div class="title">🧡 添加好友</div>
  <div class="sub"></div>
  <div class="card">
    <div class="qr-wrap" id="qrWrap">
      <span class="loading">加载中...</span>
    </div>
    <div class="wx-label">微信号</div>
    <div class="wx-id" id="wxId">加载中...</div>
    <button class="btn" onclick="copyWx()">📋 复制微信号</button>
    <div class="hint">
      <strong>怎么添加？</strong><br>
      1. 复制微信号 → 微信搜索添加<br>
      2. 电脑端扫码也可以添加
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ========== 液态铬 LiquidChrome — 纯原生WebGL，零外部依赖 ==========
(function(){
  var canvas=document.getElementById('lc-canvas');
  if(!canvas)return;

  var gl=canvas.getContext('webgl')||canvas.getContext('experimental-webgl');
  if(!gl){console.warn('WebGL not supported');return;}

  // ---- 顶点着色器（全屏三角形）----
  var vsSrc=
    'attribute vec2 aPos;' +
    'attribute vec2 aUv;' +
    'varying vec2 vUv;' +
    'void main(){vUv=aUv;gl_Position=vec4(aPos,0.0,1.0);}';

  // ---- 片元着色器（液态铬核心）----
  var fsSrc=
    'precision highp float;' +
    'uniform float uTime;' +
    'uniform vec2 uRes;' +
    'uniform vec3 uBaseColor;' +
    'uniform float uAmp;' +
    'uniform vec2 uMouse;' +
    'varying vec2 vUv;' +

    'vec3 render(vec2 uv){' +
      'vec2 p=(uv*2.0-1.0);' +
      'p.x*=uRes.x/uRes.y;' +

      // UV 扭曲迭代
      'for(float i=1.0;i<9.0;i++){' +
        'p.x+=uAmp/i*cos(i*3.0*p.y+uTime+uMouse.x*3.14159);' +
        'p.y+=uAmp/i*cos(i*3.0*p.x+uTime+uMouse.y*3.14159);' +
      '}' +

      // 鼠标涟漪
      'vec2 d=uv-uMouse;' +
      'float dist=length(d);' +
      'float fall=exp(-dist*18.0);' +
      'float rip=sin(12.0*dist-uTime*2.5)*0.025;' +
      'p+=(d/(dist+0.0001))*rip*fall;' +

      // 颜色生成
      'return uBaseColor/abs(sin(uTime*0.7-p.y*1.5-p.x*1.2));' +
    '}' +

    'void main(){' +
      // 3x3 超采样抗锯齿
      'vec3 col=vec3(0.0);' +
      'vec2 px=1.0/uRes;' +
      'col+=render(vUv+vec2(-px.x,-px.y));' +
      'col+=render(vUv+vec2(0.0,-px.y));' +
      'col+=render(vUv+vec2(px.x,-px.y));' +
      'col+=render(vUv+vec2(-px.x,0.0));' +
      'col+=render(vUv);' +
      'col+=render(vUv+vec2(px.x,0.0));' +
      'col+=render(vUv+vec2(-px.x,px.y));' +
      'col+=render(vUv+vec2(0.0,px.y));' +
      'col+=render(vUv+vec2(px.x,px.y));' +
      'col/=9.0;' +

      // 轻微色调映射 + gamma
      'col=pow(col,vec3(0.9));' +
      'col=col/(col+vec3(0.45));' +
      'gl_FragColor=vec4(col,1.0);' +
    '}';

  // ---- 编译着色器 ----
  function compile(type,src){
    var s=gl.createShader(type);
    gl.shaderSource(s,src);
    gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
      console.error('Shader error:',gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }

  var vShader=compile(gl.VERTEX_SHADER,vsSrc);
  var fShader=compile(gl.FRAGMENT_SHADER,fsSrc);
  if(!vShader||!fShader)return;

  var program=gl.createProgram();
  gl.attachShader(program,vShader);
  gl.attachShader(program,fShader);
  gl.linkProgram(program);
  if(!gl.getProgramParameter(program,gl.LINK_STATUS)){console.error('Link error');return;}
  gl.useProgram(program);

  // ---- 全屏三角形顶点 ----
  // 一个大三角形覆盖整个屏幕 (clip space)
  var verts=new Float32Array([
    -1,-1, 0,0,
     3,-1, 2,0,
    -1, 3, 0,2
  ]);
  var buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,verts,gl.STATIC_DRAW);

  var aPos=gl.getAttribLocation(program,'aPos');
  var aUv=gl.getAttribLocation(program,'aUv');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,16,0);
  gl.enableVertexAttribArray(aUv);
  gl.vertexAttribPointer(aUv,2,gl.FLOAT,false,16,8);

  // ---- Uniform 位置 ----
  var uTime=gl.getUniformLocation(program,'uTime');
  var uRes=gl.getUniformLocation(program,'uRes');
  var uBaseColor=gl.getUniformLocation(program,'uBaseColor');
  var uAmp=gl.getUniformLocation(program,'uAmp');
  var uMouse=gl.getUniformLocation(program,'uMouse');

  // 初始值
  gl.uniform3f(uBaseColor,0.30,0.13,0.55);   // 深紫 #4d228c
  gl.uniform1f(uAmp,0.28);
  gl.uniform2f(uMouse,0.5,0.5);

  // ---- 尺寸适配 ----
  function resize(){
    var w=window.innerWidth;
    var h=window.innerHeight;
    var dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=w*dpr;
    canvas.height=h*dpr;
    canvas.style.width=w+'px';
    canvas.style.height=h+'px';
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.uniform2f(uRes,canvas.width,canvas.height);
  }
  window.addEventListener('resize',resize);
  resize();

  // ---- 鼠标/触摸交互 ----
  function onMove(x,y){
    gl.uniform2f(uMouse,x/canvas.offsetWidth,1-y/canvas.offsetHeight);
  }
  document.addEventListener('mousemove',function(e){onMove(e.clientX,e.clientY)});
  document.addEventListener('touchmove',function(e){
    if(e.touches.length>0)onMove(e.touches[0].clientX,e.touches[0].clientY);
  },{passive:true});

  // ---- 渲染循环 ----
  var start=null;
  function frame(ts){
    if(!start)start=ts;
    var t=(ts-start)/1000;
    gl.uniform1f(uTime,t*0.35);  // speed
    gl.drawArrays(gl.TRIANGLES,0,3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

<script>
var p=new URLSearchParams(location.search);
var wxId=p.get('wx')||'未设置';
var imgUrl=p.get('img');
document.getElementById('wxId').textContent=wxId;

var wrap=document.getElementById('qrWrap');
if(imgUrl){
  fetch(imgUrl,{referrerPolicy:'no-referrer'}).then(function(r){
    if(!r.ok)throw new Error('status '+r.status);
    return r.blob();
  }).then(function(blob){
    var u=URL.createObjectURL(blob);
    wrap.innerHTML='<img src="'+u+'">';
  }).catch(function(){
    wrap.innerHTML='<img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(wxId)+'">';
  });
}else{
  wrap.innerHTML='<img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(wxId)+'">';
}
}else{
  wrap.innerHTML='<img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(wxId)+'">';
}

function copyWx(){
  var id=document.getElementById('wxId').textContent;
  if(id==='未设置')return;
  if(navigator.clipboard){navigator.clipboard.writeText(id).then(show)}
  else{var ta=document.createElement('textarea');ta.value=id;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);show()}
}
function show(){
  var t=document.getElementById('toast');
  t.textContent='已复制！打开微信 → 添加朋友 → 粘贴搜索';
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2500)
}
</script>
</body>
</html>
