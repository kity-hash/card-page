<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta property="og:title" content="点击添加好友">
<meta property="og:description" content="扫描二维码添加微信好友">
<title>添加好友</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:24px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
.page{text-align:center;max-width:420px;width:100%}
.title{color:#fff;font-size:28px;font-weight:700;margin-bottom:32px;text-shadow:0 2px 8px rgba(0,0,0,0.2)}
.card{background:#fff;border-radius:20px;padding:32px 24px;box-shadow:0 12px 40px rgba(0,0,0,0.15);margin-bottom:24px}
.profile{display:flex;align-items:center;gap:14px;margin-bottom:24px;text-align:left}
.avatar{width:64px;height:64px;border-radius:12px;background:#f3f4f6;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.nickname{font-size:17px;font-weight:600;color:#1f2937;line-height:1.4}
.region{font-size:13px;color:#9ca3af;margin-top:4px}
.qr-img{width:100%;max-width:280px;height:auto;display:block;margin:0 auto;border-radius:8px}
.wx-label{font-size:13px;color:rgba(255,255,255,0.85);margin-bottom:8px}
.wx-id{font-size:28px;font-weight:700;color:#fff;margin-bottom:24px;word-break:break-all;text-shadow:0 2px 8px rgba(0,0,0,0.2)}
.btn{display:block;width:100%;padding:14px;background:#07C160;color:#fff;border:none;border-radius:12px;font-size:17px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(7,193,96,0.3)}
.btn:active{opacity:.85;transform:translateY(1px)}
.hint{color:rgba(255,255,255,0.9);font-size:13px;margin-top:24px;line-height:1.8;background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border-radius:14px;padding:16px 20px}
.hint strong{display:block;margin-bottom:8px;font-size:14px}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:#fff;padding:14px 28px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .3s;z-index:99;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="page">
  <div class="title">🤝 添加好友</div>

  <div class="card">
    <div class="profile" id="profile" style="display:none">
      <div class="avatar"><img id="avatar" src="" alt=""></div>
      <div>
        <div class="nickname" id="nickname"></div>
        <div class="region" id="region"></div>
      </div>
    </div>
    <img class="qr-img" id="qrImg" src="" alt="微信二维码">
  </div>

  <div class="wx-label">微信号</div>
  <div class="wx-id" id="wxId">加载中...</div>

  <button class="btn" onclick="copyWx()">📋 复制微信号</button>

  <div class="hint">
    <strong>怎么添加？</strong>
    1. 长按二维码 → 识别图中二维码<br>
    2. 或复制微信号 → 微信搜索添加
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var p=new URLSearchParams(location.search);
var wxId=p.get('wx')||'未设置';
var imgUrl=p.get('img');
var nickname=p.get('nickname')||'';
var avatar=p.get('avatar')||'';
var region=p.get('region')||'';

document.getElementById('wxId').textContent=wxId;

// 显示用户资料（可选）
if(nickname||avatar||region){
  document.getElementById('nickname').textContent=nickname||'微信好友';
  document.getElementById('region').textContent=region||'';
  if(avatar)document.getElementById('avatar').src=avatar;
  document.getElementById('profile').style.display='flex';
}

// 显示二维码（核心 - 用 fetch 绕开防盗链）
if(imgUrl){
  fetch(imgUrl,{referrerPolicy:'no-referrer',mode:'cors'}).then(function(r){
    if(!r.ok)throw 0;
    return r.blob();
  }).then(function(blob){
    document.getElementById('qrImg').src=URL.createObjectURL(blob);
  }).catch(function(){
    // 失败时降级：用 qrserver 生成 wxId 的二维码
    document.getElementById('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(wxId);
  });
}else{
  document.getElementById('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(wxId);
}

function copyWx(){
  var id=document.getElementById('wxId').textContent;
  if(id==='未设置')return;
  if(navigator.clipboard){navigator.clipboard.writeText(id).then(show).catch(fallback)}
  else fallback();
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=id;document.body.appendChild(ta);
    ta.select();document.execCommand('copy');
    document.body.removeChild(ta);show();
  }
}
function show(){
  var t=document.getElementById('toast');
  t.textContent='已复制！打开微信 → 添加朋友 → 粘贴搜索';
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show')},2500);
}
</script>

</body>
</html>
